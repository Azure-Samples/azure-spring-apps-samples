spring.application.name=java-21-sample
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS
management.endpoint.health.show-details=always
management.health.ssl.enabled=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.healthcheck.enabled=true
spring.cloud.config.enabled=false
# Java 21: enable virtual threads for better concurrency
spring.threads.virtual.enabled=true
# SSL bundle for SslHealthIndicator (JKS keystore with self-signed demo certificate)
spring.ssl.bundle.jks.demo.keystore.location=classpath:ssl/demo.jks
spring.ssl.bundle.jks.demo.keystore.password=changeit
spring.ssl.bundle.jks.demo.keystore.type=JKS
spring.ssl.bundle.jks.demo.key.alias=ssl-demo
spring.ssl.bundle.jks.demo.key.password=changeit
# Warn if the certificate expires within 30 days (default is 7 days)
management.health.ssl.certificate-validity-warning-threshold=P30D
